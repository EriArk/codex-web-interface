name: codex-web
services:
  hub:
    image: codex-web-hub:${WEB_REVISION:-local}
    build:
      context: ../..
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    container_name: codex-web-hub
    restart: unless-stopped
    init: true
    network_mode: host
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1.5
    tmpfs: ["/tmp:size=32m,mode=1777"]
    command: [node, dist/web-main.js]
    environment:
      HUB_ROLE: web
      HUB_ENGINE_SOCKET: /run/codex-engine/engine.sock
      HUB_RELEASE_ROOT: /releases
    volumes:
      - "${CODEX_WEB_STATE}/config.json:/config/config.json:ro"
      - "${CODEX_WEB_STATE}/engine:/run/codex-engine:ro"
      - "${CODEX_WEB_STATE}/web-releases:/releases:ro"
    depends_on:
      engine:
        condition: service_healthy
  engine:
    image: codex-web-hub:${ENGINE_REVISION:-local}
    container_name: codex-web-engine
    restart: unless-stopped
    init: true
    network_mode: host
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1.5
    stop_grace_period: 45s
    tmpfs: ["/tmp:size=32m,mode=1777"]
    env_file: ["${CODEX_WEB_STATE}/remote.env"]
    environment:
      HUB_ROLE: engine
      HUB_ENGINE_SOCKET: /run/codex-engine/engine.sock
      HUB_RELEASE_ROOT: /releases
    volumes:
      - "${CODEX_WEB_STATE}/config.json:/config/config.json:ro"
      - "${CODEX_WEB_STATE}/engine:/run/codex-engine"
      - "${CODEX_WEB_STATE}/web-releases:/releases:ro"
      - "${CODEX_WEB_STATE}/ssh:${CODEX_WEB_STATE}/ssh:ro"
      - "${CODEX_WEB_STATE}/data:${CODEX_WEB_STATE}/data"
      - "${CODEX_WEB_STATE}/speech:/run/codex-speech:ro"
      - "${GPT_NATIVE_ADAPTER_PATH:-${CODEX_WEB_STATE}/native-gpt}:/run/codex-gpt-native:ro"
    depends_on: [guacd]
  guacd:
    image: guacamole/guacd:1.6.0@sha256:8974eaa9ba32f713daf311e7cc8cd7e4cdfba1edea39eed75524e78ef4b08f4f
    container_name: codex-web-guacd
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 1
    ports: ["127.0.0.1:4822:4822"]
  tunnel:
    image: cloudflare/cloudflared:2026.8.3@sha256:51c9cefcb4569df44e1ad403ab1d3d8065aa8e84339bcfc6aee75502e1140339
    container_name: codex-web-tunnel
    restart: unless-stopped
    network_mode: host
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    cpus: 0.5
    tmpfs: ["/tmp:size=16m,mode=1777"]
    command: [tunnel, --no-autoupdate, --config, /etc/cloudflared/config.yml, run]
    volumes:
      - "${CODEX_WEB_STATE}/tunnel:/etc/cloudflared:ro"
    depends_on:
      hub:
        condition: service_healthy

  gpt:
    profiles: [gpt]
    image: codex-web-gpt:${GPT_REVISION:-local}
    build:
      context: ../gpt
      args:
        SOURCE_REVISION: ${GPT_REVISION:-unknown}
    container_name: codex-web-gpt-connect
    environment:
      GPT_UPLOAD_MAX_BYTES: ${GPT_UPLOAD_MAX_BYTES:-2147483648}
      GPT_ARTIFACT_MAX_BYTES: ${GPT_ARTIFACT_MAX_BYTES:-8589934592}
    hostname: codex-web-gpt
    restart: unless-stopped
    init: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Long native ChatGPT threads can exceed 1 GiB in Chromium alone.
    mem_limit: ${GPT_MEMORY_LIMIT:-2g}
    memswap_limit: ${GPT_MEMORY_SWAP_LIMIT:-3g}
    stop_grace_period: 30s
    cpus: 1
    shm_size: 256m
    ports: ["127.0.0.1:8786:8786"]
    volumes:
      - "${CODEX_WEB_STATE}/gpt:/data"

  speech:
    profiles: [speech]
    image: codex-web-speech:${SPEECH_REVISION:-local}
    build:
      context: ../speech
    container_name: codex-web-speech
    restart: unless-stopped
    init: true
    network_mode: none
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 1
    tmpfs: ["/tmp:size=16m,mode=1777"]
    volumes:
      - "${CODEX_WEB_STATE}/speech:/run/speech"
