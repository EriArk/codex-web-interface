# Configuration, not credentials. Copy outside the repository for deployment.
hub:
  publicBaseUrl: https://codex.example.com
  host: 127.0.0.1
  port: 8780
  databasePath: /srv/codex-web/data/app.db
  resultsPath: /srv/codex-web/data/results
  secureCookies: true
  codexIdleTimeoutMinutes: 30

# Internal single-user record name only. Login does not ask for a username.
auth:
  username: owner

machines:
  - id: main-windows
    name: My PC
    type: ssh-windows
    ssh:
      target: main-windows
      configFile: /srv/codex-web/ssh/config
    codex:
      command: auto
      shell: powershell
      # Enable only after installing the local named-pipe Companion.
      # launcher: 'C:\Users\YOUR_USER\AppData\Local\CodexWeb\companion\CodexWebBridge.exe'
    remote:
      provider: rdp
      host: 192.0.2.20 # Documentation address; replace with your PC's LAN/Tailnet address.
      port: 3389
      username: YOUR_USER
      passwordSecret: REMOTE_MAIN_WINDOWS_PASSWORD

projects:
  - id: my-project
    name: My Project
    machineId: main-windows
    workingDirectory: 'C:\Users\YOUR_USER\Projects\MyProject'
    enabled: true
