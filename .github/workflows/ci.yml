name: Repository checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Portable Hub and PWA
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
      - name: Install pinned package manager
        run: npm install --global pnpm@11.13.1
      - name: Check repository contents
        run: node scripts/check-repository.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Check optional GPT connector syntax
        run: for file in ops/gpt/*.mjs ops/gpt/connect-client.js; do node --check "$file"; done
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Build must not change tracked files
        run: git diff --exit-code

  browser:
    name: Chromium and WebKit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07
      options: --shm-size=256m
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
      - run: npm install --global pnpm@11.13.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node tests/copy-controls.browser.mjs
      - run: node tests/message-speech.browser.mjs
      - run: node tests/background-media.browser.mjs
      - run: node tests/gpt-preparation.browser.mjs
      - run: node tests/gpt-outbox.browser.mjs
      - run: node tests/gpt-reliability.browser.mjs
      - run: node tests/gpt-load.browser.mjs
      - run: node tests/reliability-codex.browser.mjs
      - run: node tests/queue-recovery.browser.mjs
      - run: node tests/turn-handoff.browser.mjs
      - run: node tests/downloads.browser.mjs
      - run: node tests/attachments-continuity.browser.mjs
      - run: node tests/file-preview.browser.mjs
      - run: node tests/pinned-navigation.browser.mjs
      - run: node tests/single-project.browser.mjs
      - run: node tests/push.browser.mjs
      - run: node tests/recovery.browser.mjs
      - run: node tests/project-results.browser.mjs
      - run: node tests/project-inspector.browser.mjs
      - run: node tests/machine-health.browser.mjs
      - run: node tests/notebook.browser.mjs
      - run: node tests/note-capture.browser.mjs
      - run: node tests/gpt-note-capture.browser.mjs
      - run: node tests/tasks.browser.mjs
      - run: node tests/project-overview.browser.mjs
      - run: node tests/project-core.browser.mjs
      - run: node tests/project-work.browser.mjs
      - run: node tests/project-rotation.browser.mjs
      - run: node tests/remote-input.browser.mjs
      - run: node tests/preview-isolation.browser.mjs

  windows-runtime:
    name: Companion runtime isolation
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check pinned runtime survives desktop cleanup
        shell: powershell
        run: ./tests/companion-runtime.tests.ps1
