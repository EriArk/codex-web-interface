name: Reconstruct UI reference images

on:
  push:
    branches: [main]
    paths:
      - 'references/.upload/READY'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct images
        shell: bash
        run: |
          set -euo pipefail
          cat references/.upload/chunk-* > /tmp/references.b64
          base64 -d /tmp/references.b64 > /tmp/references.tar.gz
          tar -xzf /tmp/references.tar.gz -C references
          rm -rf references/.upload
          rm .github/workflows/reconstruct-references.yml
      - name: Commit reference images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add references .github/workflows/reconstruct-references.yml
          git commit -m 'Add UI reference images'
          git push
